function getTeachers(id,row){

      var classId = document.getElementById("class_id").value;
      var sectionId = document.getElementById("txt_section").value;

              // code for IE7+, Firefox, Chrome, Opera, Safari
              xmlhttp=new XMLHttpRequest();
            } else { // code for IE6, IE5
              xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
            }
            xmlhttp.onreadystatechange=function() {
              if (xmlhttp.readyState==4 && xmlhttp.status==200) {
                document.getElementById("tech"+row).innerHTML=xmlhttp.responseText;
               // alert(xmlhttp.responseText);
              }
            }
            // Send request with all 3 parameters
            xmlhttp.open(
            "GET",
            "get_teachers.php?subc=" + encodeURIComponent(id) +
            "&class_id=" + encodeURIComponent(classId) +
            "&section_id=" + encodeURIComponent(sectionId),
            true
            );
            xmlhttp.send();
          }
